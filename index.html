<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>信号共鸣</title>
<link rel="stylesheet" href="style.css" />
</head>
<body data-state="idle">

  <div class="aura" aria-hidden="true"></div>

  <main class="stage">

    <div class="particles" data-particles aria-hidden="true"></div>
    <div class="core" aria-hidden="true"></div>

    <section class="panel panel--input" aria-labelledby="hint">
      <p class="eyebrow">SIGNAL / RESONANCE</p>
      <h1 class="hint" id="hint">等待双方信号接入...</h1>

      <form class="link" data-form novalidate>
        <label class="sr-only" for="codename">你的代号</label>
        <input
          class="link__input"
          id="codename"
          name="codename"
          type="text"
          autocomplete="off"
          spellcheck="false"
          maxlength="12"
          placeholder="你的代号"
        />
        <label class="sr-only" for="partner">对方代号</label>
        <input
          class="link__input"
          id="partner"
          name="partner"
          type="text"
          autocomplete="off"
          spellcheck="false"
          maxlength="12"
          placeholder="对方代号"
        />
        <button class="link__btn" type="submit">建立连接</button>
      </form>

      <p class="notice" data-notice role="status" aria-live="polite"></p>
    </section>

    <section class="panel panel--scan" aria-hidden="true">
      <svg class="pulse" viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true">
        <path class="pulse__track" pathLength="100"
          d="M0 60 H150 L168 60 L178 34 L190 92 L202 60 H300 L318 60 L328 28 L340 96 L352 60 H600" />
        <path class="pulse__line" pathLength="100"
          d="M0 60 H150 L168 60 L178 34 L190 92 L202 60 H300 L318 60 L328 28 L340 96 L352 60 H600" />
      </svg>
      <p class="scan__text">正在解析频率...</p>
    </section>

    <section class="panel panel--result" aria-hidden="true">
      <p class="eyebrow">SIGNAL LOCKED</p>
      <p class="score"><span class="score__num" data-score>0.00</span><span class="score__unit">%</span></p>
      <p class="verdict" data-verdict></p>
      <button class="reset" type="button" data-reset>重新接入</button>
    </section>

  </main>

<script src="script.js"></script>
</body>
</html>
